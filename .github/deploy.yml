name Deploy to GitHub Pages

on
  push
    branches [main]

permissions
  contents read
  pages write
  id-token write

concurrency
  group pages
  cancel-in-progress false

jobs
  build
    runs-on ubuntu-latest
    steps
      - name Checkout
        uses actionscheckout@v4

      - name Setup Node.js
        uses actionssetup-node@v4
        with
          node-version 20
          cache npm

      - name Install dependencies
        run npm ci

      - name Build project
        run npm run build

      - name Upload custom folder artifact
        uses actionsupload-pages-artifact@v3
        with

          path ./frontend/index.html

  deploy
    environment
      name github-pages
      url ${{ steps.deployment.outputs.page_url }}
    runs-on ubuntu-latest
    needs build
    steps
      - name Deploy to GitHub Pages
        id deployment
        uses actionsdeploy-pages@v4
        